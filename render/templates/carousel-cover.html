<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>carousel cover</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* The cover: the wordmark on top, the series as a mono eyebrow, the two-tone headline, all centred. */
  :root { --w: 1080px; --h: 1350px; --wm: 56px; }
  .frame { align-items: center; text-align: center; }
  .label { margin: 34px 0 30px; font-size: 28px; letter-spacing: 0.1em; text-transform: uppercase; }
  .grow { width: 100%; align-items: center; margin: 0 0 48px; }
  .sub { margin-top: 44px; }
  .footer { width: 100%; }
  .footer span:first-child { opacity: 0.66; }
</style></head>
<body class="tone-{{tone}}"><div class="frame">
  <div class="grow" data-fit="headline and subhead">
    <div class="wordmark"><span class="mark"><i></i><i></i><i></i></span><span class="words">MAKE YOUR MIND/</span><span class="up">UP</span></div>
    <div class="label">{{label}}</div>
    <h1 class="headline" data-max="150" data-min="72"><span class="lead">{{headline}}</span><span class="accent" data-empty-hide>{{accent}}</span></h1>
    <p class="sub" data-max="50" data-min="32" data-empty-hide>{{subhead}}</p>
  </div>
  <div class="footer"><span>makeyourmindup.ai</span><span class="page">{{page}}</span></div>
</div><script src="../fit.js"></script></body></html>
