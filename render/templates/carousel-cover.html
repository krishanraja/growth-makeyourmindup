<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>carousel cover</title>
<link rel="stylesheet" href="../kit.css">
<style>
  :root { --w: 1080px; --h: 1350px; }
  .grow { margin: 48px 0 56px; }
  .rule { margin: 48px 0 40px; }
</style></head>
<body><div class="frame">
  <div class="label">{{label}}</div>
  <div class="grow" data-fit="headline and subhead">
    <h1 class="heading" data-max="150" data-min="72">{{headline}}</h1>
    <div class="rule"></div>
    <p class="sub" data-max="52" data-min="34" data-empty-hide>{{subhead}}</p>
  </div>
  <div class="footer"><span>makeyourmindup.ai</span><span class="page">{{page}}</span></div>
</div><script src="../fit.js"></script></body></html>
