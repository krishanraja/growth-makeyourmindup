<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>carousel body</title>
<link rel="stylesheet" href="../kit.css">
<style>
  :root { --w: 1080px; --h: 1350px; }
  .grow { margin: 48px 0 56px; }
  .rule { margin: 48px 0 32px; }
</style></head>
<body><div class="frame">
  <div class="label">{{label}}</div>
  <div class="grow" data-fit="body and attribution">
    <p class="body" data-max="84" data-min="44">{{body}}</p>
    <div class="rule"></div>
    <p class="small" data-max="32" data-min="28" data-empty-hide>{{attribution}}</p>
  </div>
  <div class="footer"><span>makeyourmindup.ai</span><span class="page">{{page}}</span></div>
</div><script src="../fit.js"></script></body></html>
