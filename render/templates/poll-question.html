<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>poll question</title>
<link rel="stylesheet" href="../kit.css">
<style>
  :root { --w: 1080px; --h: 1350px; }
  .grow { margin: 48px 0 0; }
  .question { margin-bottom: 0; }
  .rule { margin: 44px 0 52px; }
  .foot { margin-top: 56px; }
</style></head>
<body><div class="frame">
  <div class="label">{{label}}</div>
  <div class="grow" data-fit="question and options">
    <h1 class="sub question" data-max="76" data-min="44">{{question}}</h1>
    <div class="rule"></div>
    <div class="options">{{options:options}}</div>
  </div>
  <div class="footer foot"><span>makeyourmindup.ai</span></div>
</div><script src="../fit.js"></script></body></html>
