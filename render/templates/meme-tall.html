<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>meme tall</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* The tall meme, centred by construction (the ruling of 15 Nov 2026: a tall meme sits centred on the screen). Everything that must be read sits in the clear box every channel leaves (y 270 to 1320, and
     right of x 880 only above y 520; content-engine config/channel-safe-zones.json): one centred column, x 200 to
     880. The clip window is fixed at x 200 to 880, y 600 to 1240 (centre 540, 920), and growth.py run meme
     composes the clip into it, fitted and centred (engine/run/tall_meme.py). The headline sits centred above it;
     the wordmark and the credit sit centred under it, above y 1320. */
  :root { --w: 1080px; --h: 1920px; --top: 270px; --bottom: 600px; --side: 200px; }
  .frame { align-items: center; text-align: center; }
  .grow { width: 100%; height: 290px; flex: none; justify-content: center; align-items: center; }
  .grow .headline { line-height: 1.1; }
  .headline { color: var(--cream); line-height: 1.02; }
  .clip { position: absolute; left: 200px; top: 600px; width: 680px; height: 640px; background: var(--ink-deep);
    border-radius: 20px; }
  .under { position: absolute; left: 200px; top: 1256px; width: 680px; display: flex; flex-direction: column;
    align-items: center; gap: 10px; }
  .under .brandmark { width: 240px; }
  .credit { font-family: var(--mono); font-size: 22px; line-height: 1.1; color: var(--cream); opacity: 0.66; }
</style></head>
<body class="tone-{{tone}}"><div class="frame">
  <div class="grow" data-fit="headline" data-centred>
    <p class="headline" data-max="84" data-min="48"><span class="lead">{{headline}}</span><span class="accent" data-empty-hide>{{accent}}</span></p>
  </div>
  <div class="clip" data-slot="clip"></div>
  <div class="under" data-centred><div class="brandmark"></div><p class="credit" data-empty-hide>{{credit}}</p></div>
</div><script src="../fit.js"></script></body></html>
