<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>meme square</title>
<link rel="stylesheet" href="../kit.css">
<style>
  :root { --w: 1080px; --h: 1080px; --bm: 168px; }
  /* The look is free; the only brand is the house mark, small in the bottom-right corner (R125, render/KIT.md). */
  .brandmark.corner { opacity: 0.85; }
  .rule { margin: 44px 0 40px; }
</style></head>
<body class="tone-{{tone}}"><div class="frame">
  <div class="grow" data-fit="setup and punchline">
    <p class="body" data-max="64" data-min="40">{{setup}}</p>
    <div class="rule"></div>
    <p class="headline" data-max="104" data-min="52"><span class="accent">{{punchline}}</span></p>
  </div>
</div><div class="brandmark corner"></div><script src="../fit.js"></script></body></html>
