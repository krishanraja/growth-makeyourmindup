<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>number card tall</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* One number story: a thin accent rule across the top, a mono eyebrow, a mixed-case title, then the numbers. */
  :root { --w: 1080px; --h: 1350px; --margin: 56px; --top: 62px; --bottom: 44px; }
  .topline { position: absolute; left: 24px; right: 24px; top: 12px; height: 12px; background: var(--butter); }
  .tone-mint .topline { background: var(--mint); }
  .tone-coral .topline { background: var(--coral); }
  .series, .context { color: var(--butter); letter-spacing: 0.06em; }
  .tone-mint .series, .tone-mint .context { color: var(--mint); }
  .tone-coral .series, .tone-coral .context { color: var(--coral); }
  .series { font-size: 22px; }
  .titlebox { flex: none; padding: 14px 0 28px; }
  .title { line-height: 1.02; }
  .grow { margin: 18px 0 32px; }
  .context { margin-bottom: 28px; }
  .numbers .row { padding: 1.05em 0; }
  .numbers .row .value { font-size: 2.75em; }
  .takeaway { margin-top: 44px; line-height: 1.04; }
  .source { font-family: var(--mono); font-size: 22px; line-height: 1.3; flex: none; }
</style></head>
<body class="tone-{{tone}}"><div class="topline"></div><div class="frame">
  <div class="eyebrow series">{{series}}</div>
  <div class="titlebox" data-fit="title"><h1 class="heading title" data-max="80" data-min="48">{{title}}</h1></div>
  <div class="grow" data-fit="numbers">
    <p class="eyebrow context" data-max="30" data-min="22" data-empty-hide>{{context}}</p>
    <div class="numbers"><div class="rows" data-max="44" data-min="26">{{rows:rows}}</div></div>
    <p class="heading takeaway" data-max="72" data-min="40" data-empty-hide>{{takeaway}}</p>
  </div>
  <p class="source quiet" data-empty-hide>{{source}}</p>
</div><script src="../fit.js"></script></body></html>
