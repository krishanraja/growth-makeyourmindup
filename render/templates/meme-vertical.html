<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>meme vertical</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* Same safe zones as a Story: the top 250px and bottom 340px stay clear. */
  :root { --w: 1080px; --h: 1920px; --top: 250px; --bottom: 340px; }
  .grow { margin: 56px 0 56px; }
  .rule { margin: 56px 0 48px; }
  .beat-setup .punch { visibility: hidden; }
</style></head>
<body class="beat-{{beat}}"><div class="frame">
  <div class="label">{{label}}</div>
  <div class="grow" data-fit="setup and punchline">
    <p class="body" data-max="72" data-min="44">{{setup}}</p>
    <div class="rule"></div>
    <p class="heading butter punch" data-max="120" data-min="60">{{punchline}}</p>
  </div>
  <div class="footer"><span>makeyourmindup.ai</span></div>
</div><script src="../fit.js"></script></body></html>
