<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>meme vertical</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* The clear box every channel leaves (content-engine config/channel-safe-zones.json): y 270 to 1320, x 200 to 880. */
  :root { --w: 1080px; --h: 1920px; --top: 270px; --bottom: 600px; --side: 200px; --wm: 40px; }
  .frame > .label { font-size: 24px; color: var(--mint); letter-spacing: 0.06em; text-transform: uppercase; }
  .grow { margin: 56px 0 56px; }
  .rule { margin: 56px 0 48px; }
  .footer span { opacity: 0.66; }
  .beat-setup .punch { visibility: hidden; }
</style></head>
<body class="beat-{{beat}} tone-{{tone}}"><div class="frame">
  <div class="label">{{label}}</div>
  <div class="grow" data-fit="setup and punchline">
    <p class="body" data-max="72" data-min="44">{{setup}}</p>
    <div class="rule"></div>
    <p class="headline punch" data-max="128" data-min="60"><span class="accent">{{punchline}}</span></p>
  </div>
  <div class="footer"><span>makeyourmindup.ai</span><div class="brandmark"></div></div>
</div><script src="../fit.js"></script></body></html>
