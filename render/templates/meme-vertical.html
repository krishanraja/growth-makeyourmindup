<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>meme vertical</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* Same safe zones as a Story: the top 250px and bottom 340px stay clear. */
  :root { --w: 1080px; --h: 1920px; --top: 250px; --bottom: 340px; --bm: 168px; }
  /* The look is free; the only brand is the house mark, small in the bottom-right corner, just above the safe
     zone (R125, render/KIT.md). */
  .brandmark.corner { bottom: calc(var(--bottom) + 8px); opacity: 0.85; }
  .grow { margin-bottom: 64px; }
  .rule { margin: 56px 0 48px; }
  .beat-setup .punch { visibility: hidden; }
</style></head>
<body class="beat-{{beat}} tone-{{tone}}"><div class="frame">
  <div class="grow" data-fit="setup and punchline">
    <p class="body" data-max="72" data-min="44">{{setup}}</p>
    <div class="rule"></div>
    <p class="headline punch" data-max="128" data-min="60"><span class="accent">{{punchline}}</span></p>
  </div>
</div><div class="brandmark corner"></div><script src="../fit.js"></script></body></html>
