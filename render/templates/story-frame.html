<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>story frame</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* The top 250px and bottom 340px stay clear of words: the platform draws over them. */
  :root { --w: 1080px; --h: 1920px; --top: 250px; --bottom: 340px; --wm: 58px; }
  html, body { background: var(--ink-deep); }
  .frame { align-items: center; text-align: center; }
  .label { margin: 34px 0 32px; font-size: 30px; letter-spacing: 0.1em; text-transform: uppercase; }
  .grow { width: 100%; align-items: center; margin: 0 0 48px; }
  .body { margin-top: 48px; }
  .footer { width: 100%; }
  .footer span:first-child { opacity: 0.66; }
</style></head>
<body class="tone-{{tone}}"><div class="frame">
  <div class="grow" data-fit="headline and body">
    <div class="wordmark"><span class="mark"><i></i><i></i><i></i></span><span class="words">MAKE YOUR MIND/</span><span class="up">UP</span></div>
    <div class="label">{{label}}</div>
    <h1 class="headline" data-max="150" data-min="72"><span class="lead">{{headline}}</span><span class="accent" data-empty-hide>{{accent}}</span></h1>
    <p class="body" data-max="56" data-min="36" data-empty-hide>{{body}}</p>
  </div>
  <div class="footer"><span>makeyourmindup.ai</span><span class="page">{{page}}</span></div>
</div><script src="../fit.js"></script></body></html>
