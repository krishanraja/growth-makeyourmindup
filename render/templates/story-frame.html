<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>story frame</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* The top 250px and bottom 340px stay clear of words: the platform draws over them. */
  :root { --w: 1080px; --h: 1920px; --top: 250px; --bottom: 340px; }
  .grow { margin: 56px 0 56px; }
  .rule { margin: 56px 0 40px; }
</style></head>
<body><div class="frame">
  <div class="label">{{label}}</div>
  <div class="grow" data-fit="headline and body">
    <h1 class="heading" data-max="136" data-min="68">{{headline}}</h1>
    <div class="rule"></div>
    <p class="body" data-max="60" data-min="38" data-empty-hide>{{body}}</p>
  </div>
  <div class="footer"><span>makeyourmindup.ai</span><span class="page">{{page}}</span></div>
</div><script src="../fit.js"></script></body></html>
