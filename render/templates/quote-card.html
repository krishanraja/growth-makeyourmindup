<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>quote card</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* A quote stays word for word, so it keeps one colour; the masthead carries the brand. */
  :root { --w: 1080px; --h: 1350px; --wm: 44px; }
  .masthead .label { font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase; }
  .quote { margin: 56px 0 0; }
  .rule { margin: 56px 0 36px; }
  .source { margin-bottom: 64px; }
  .footer span { opacity: 0.66; }
</style></head>
<body><div class="frame">
  <div class="masthead"><div class="wordmark"><span class="mark"><i></i><i></i><i></i></span><span class="words">MAKE YOUR MIND/</span><span class="up">UP</span></div><div class="label">{{label}}</div></div>
  <div class="grow quote" data-fit="quote"><p class="body" data-max="88" data-min="44">{{quote}}</p></div>
  <div class="rule"></div>
  <p class="small source" data-empty-hide>{{source}}</p>
  <div class="footer"><span>makeyourmindup.ai</span></div>
</div><script src="../fit.js"></script></body></html>
