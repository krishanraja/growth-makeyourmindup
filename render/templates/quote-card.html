<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>quote card</title>
<link rel="stylesheet" href="../kit.css">
<style>
  :root { --w: 1080px; --h: 1350px; }
  .quote { margin: 56px 0 0; }
  .rule { margin: 56px 0 36px; }
  .source { margin-bottom: 64px; }
</style></head>
<body><div class="frame">
  <div class="label">{{label}}</div>
  <div class="grow quote" data-fit="quote"><p class="body" data-max="92" data-min="46">{{quote}}</p></div>
  <div class="rule"></div>
  <p class="small source" data-empty-hide>{{source}}</p>
  <div class="footer"><span>makeyourmindup.ai</span></div>
</div><script src="../fit.js"></script></body></html>
