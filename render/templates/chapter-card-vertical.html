<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>chapter card vertical</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* A video chapter card: a butter mono eyebrow, a cream headline with a mint second line, the entity under it. */
  :root { --w: 1080px; --h: 1920px; --margin: 96px; --top: 250px; --bottom: 340px; }
  /* The top 250px and bottom 340px stay clear of words: the platform draws over them. */
  .frame { justify-content: center; }
  .eyebrow { color: var(--butter); letter-spacing: 0.12em; margin-bottom: 0.7em; }
  .headline { line-height: 0.98; }
  .tone- .accent { color: var(--mint); }
  .entity { font-family: var(--body); font-weight: 800; line-height: 1.1; color: var(--cream); margin-top: 0.3em; }
</style></head>
<body class="tone-{{tone}}"><div class="frame">
  <div class="grow" data-fit="chapter">
    <p class="eyebrow" data-max="30" data-min="22">{{eyebrow}}</p>
    <h1 class="headline" data-max="112" data-min="64"><span class="lead">{{headline}}</span><span class="accent" data-empty-hide>{{accent}}</span></h1>
    <p class="entity" data-max="60" data-min="36" data-empty-hide>{{entity}}</p>
  </div>
</div><script src="../fit.js"></script></body></html>
