<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>versus card tall</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* The tall share card: everything centred, the wordmark on top, the versus rows under the headline. */
  :root { --w: 1080px; --h: 1350px; --margin: 96px; --top: 120px; --bottom: 72px; --wm: 58px; }
  html, body { background: var(--ink-deep); }
  .frame { align-items: center; text-align: center; }
  .grow { width: 100%; align-items: center; }
  .eyebrow { color: var(--mint); margin: 40px 0 0; }
  .headline { margin: 30px 0 52px; }
  .rows { width: 100%; text-align: left; }
  .versus .row { padding: 18px 22px 18px 30px; }
  .versus .row .name { font-size: 1em; }
  .versus .row .value { font-size: 1.12em; }
  .footer { justify-content: center; }
</style></head>
<body class="tone-{{tone}}"><div class="frame">
  <div class="wordmark"><span class="mark"><i></i><i></i><i></i></span><span class="words">MAKE YOUR MIND/</span><span class="up">UP</span></div>
  <div class="grow versus" data-fit="headline and rows">
    <p class="eyebrow" data-max="28" data-min="22" data-empty-hide>{{label}}</p>
    <h1 class="headline" data-max="132" data-min="64"><span class="lead">{{headline}}</span><span class="accent" data-empty-hide>{{accent}}</span></h1>
    <div class="rows" data-max="44" data-min="28">{{rows:rows}}</div>
  </div>
  <div class="footer quiet"><span>makeyourmindup.ai</span></div>
</div><script src="../fit.js"></script></body></html>
