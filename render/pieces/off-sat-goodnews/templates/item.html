<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>item</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body><div class="frame item"><div class="tray"><div class="clipping">
  <div class="fit clipping-tab" data-fit="number"><div data-max="32" data-min="24">{{number}}</div></div>
  <div class="photo-mount">{{photo:photo}}</div>
  <div class="fit big" data-fit="headline"><div data-max="88" data-min="44">{{headline}}</div></div>
  <div class="fit copy" data-fit="why_good"><div data-max="44" data-min="28">{{why_good}}</div></div>
  <div class="source">
    <div class="fit source-name" data-fit="source"><div data-max="26" data-min="20">{{source}}</div></div>
    <div class="fit source-date" data-fit="date"><div data-max="24" data-min="20">{{date}}</div></div>
    <div class="fit source-credit" data-fit="credit"><div data-max="24" data-min="20">{{credit}}</div></div>
  </div>
</div></div></div><script src="../../../fit.js"></script></body></html>
