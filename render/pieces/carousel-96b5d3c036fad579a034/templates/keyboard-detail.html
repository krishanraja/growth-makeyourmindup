<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Keyboard detail</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body><div class="frame detail">
<div class="topline"><div class="labelbox" data-fit="series"><p class="label" data-max="28" data-min="20">{{label}}</p></div><div class="pagebox" data-fit="page"><p data-max="26" data-min="18">{{page}}</p></div></div>
<div class="titlebox" data-fit="headline"><h1 class="headline" data-max="100" data-min="52">{{headline}}</h1></div>
<div class="machine"><div class="keyboard"><div class="keys" aria-hidden="true"><i class="key"></i><i class="key"></i><i class="key"></i><i class="key worn"></i><i class="key"></i><i class="key"></i><i class="key"></i><i class="key"></i><i class="key"></i><i class="key"></i><i class="key worn"></i><i class="key"></i><i class="key"></i><i class="key"></i></div><div class="space"></div></div><div class="lifted" aria-hidden="true"></div><div class="imprints" aria-hidden="true"><i></i><i></i><i></i></div><div class="leader" aria-hidden="true"></div><div class="callout" data-fit="key note"><p data-max="32" data-min="23">{{key_note}}</p></div></div>
<div class="captionbox" data-fit="body"><p class="sub" data-max="42" data-min="28">{{body}}</p></div>
<div class="footerbox" data-fit="source"><p data-max="22" data-min="16">{{source}}</p></div>
</div><script src="../../../fit.js"></script></body></html>
