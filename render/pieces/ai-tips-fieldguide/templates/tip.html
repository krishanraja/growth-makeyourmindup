<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>tip</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body><div class="frame tip">
  <div class="page">
    <div class="num">{{rank}}</div>
    <div class="tile">{{photo:logo}}</div>
    <div class="fit tool" data-fit="tool"><div data-max="30" data-min="22">{{tool}}</div></div>
    <div class="fit big" data-fit="headline"><div><div data-max="112" data-min="60">{{headline}}</div><div class="accent" data-max="112" data-min="60">{{accent}}</div></div></div>
    <div class="hair"></div>
    <div class="fit steps" data-fit="steps"><div data-max="40" data-min="28">{{rows:steps}}</div></div>
    <div class="fit who" data-fit="who"><div data-max="28" data-min="22">{{who}}</div></div>
  </div>
  <div class="strip"></div>
  <div class="count">{{count}}</div>
  <div class="brandmark corner"></div>
</div><script src="../../../fit.js"></script></body></html>
