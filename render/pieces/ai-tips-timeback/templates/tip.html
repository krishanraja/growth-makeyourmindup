<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>tip</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body><div class="frame tip">
  <div class="rank">{{rank}}</div>
  <div class="tile">{{photo:logo}}</div>
  <div class="fit tool" data-fit="tool"><div data-max="32" data-min="22">{{tool}}</div></div>
  <div class="fit big" data-fit="headline"><div><div data-max="118" data-min="62">{{headline}}</div><div class="accent" data-max="118" data-min="62">{{accent}}</div></div></div>
  <div class="prompt"><div class="fit how" data-fit="how"><div data-max="46" data-min="30">{{how}}</div></div></div>
  <div class="saves m{{meter}}"><div class="key">Time back</div><div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><div class="fit who" data-fit="who"><div data-max="26" data-min="20">{{who}}</div></div></div>
  <div class="rule-line"></div>
  <div class="count">{{count}}</div>
  <div class="brandmark corner"></div>
</div><script src="../../../fit.js"></script></body></html>
