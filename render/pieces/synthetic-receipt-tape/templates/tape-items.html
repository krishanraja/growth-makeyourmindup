<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>receipt tape items</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>
  /* The middle of the tape: who gets paid, line by line, and the total under a cut line. */
  :root { --w: 1080px; --h: 1350px; --margin: 128px; --top: 72px; --bottom: 72px; }
  .till { font-size: 26px; }
  .tape { margin-top: -22px; }
  .items .headline { text-align: left; margin-bottom: 44px; }
  .total .what { font-size: 30px; }
  .total .sum { font-size: 128px; }
</style></head>
<body><div class="frame">
  <div class="slot"></div>
  <div class="tape items">
    <div class="till">{{label}}</div>
    <div class="cut"></div>
    <div class="grow" data-fit="items"><h1 class="headline" data-max="84" data-min="44"><span class="lead">{{heading}}</span></h1><div class="rows" data-max="42" data-min="24">{{rows:rows}}</div></div>
    <div class="cut"></div>
    <div class="total"><span class="what">{{total_label}}</span><span class="sum">{{total}}</span></div>
  </div>
  <div class="under"><span>makeyourmindup.ai</span><span class="page">{{page}}</span></div>
</div><script src="../../../fit.js"></script></body></html>
