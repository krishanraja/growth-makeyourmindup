<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>receipt tape cover</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>
  /* The cover: the wordmark, the till slot, and the headline printed on the first length of tape. */
  :root { --w: 1080px; --h: 1350px; --margin: 128px; --top: 88px; --bottom: 72px; --wm: 50px; }
  .wordmark { margin: 0 0 40px; }
  .till { font-size: 26px; }
</style></head>
<body><div class="frame">
  <div class="wordmark"><span class="mark"><i></i><i></i><i></i></span><span class="words">MAKE YOUR MIND/</span><span class="up">UP</span></div>
  <div class="slot"></div>
  <div class="tape tone-{{tone}}">
    <div class="till">{{label}}</div>
    <div class="cut"></div>
    <div class="grow" data-fit="headline"><h1 class="headline" data-max="132" data-min="60"><span class="lead">{{headline}}</span><span class="accent" data-empty-hide>{{accent}}</span></h1></div>
    <div class="cut"></div>
    <div class="till"><span class="quiet">makeyourmindup.ai</span></div>
  </div>
  <div class="under"><span>Keep your receipt</span><span class="page">{{page}}</span></div>
</div><script src="../../../fit.js"></script></body></html>
