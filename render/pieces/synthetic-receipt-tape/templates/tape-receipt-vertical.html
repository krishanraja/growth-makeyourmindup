<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>receipt tape, the whole receipt</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>
  /* The whole receipt for a story frame; the top 250px and bottom 340px stay clear of words. */
  :root { --w: 1080px; --h: 1920px; --margin: 120px; --top: 250px; --bottom: 340px; --wm: 46px; }
  .wordmark { margin: 0 0 36px; }
  .till { font-size: 26px; }
  .items .headline { margin-bottom: 40px; }
  .total .what { font-size: 30px; }
  .total .sum { font-size: 120px; }
  .stamp { font-size: 84px; bottom: 210px; }
</style></head>
<body><div class="frame">
  <div class="wordmark"><span class="mark"><i></i><i></i><i></i></span><span class="words">MAKE YOUR MIND/</span><span class="up">UP</span></div>
  <div class="slot"></div>
  <div class="tape items">
    <div class="till">{{label}}</div>
    <div class="cut"></div>
    <div class="grow" data-fit="receipt"><h1 class="headline" data-max="96" data-min="48"><span class="lead">{{headline}}</span></h1><div class="rows" data-max="38" data-min="24">{{rows:rows}}</div></div>
    <div class="cut"></div>
    <div class="total"><span class="what">{{total_label}}</span><span class="sum">{{total}}</span></div>
    <div class="stamp" data-empty-hide>{{stamp}}</div>
  </div>
  <div class="under"><span>makeyourmindup.ai</span><span class="page">{{page}}</span></div>
</div><script src="../../../fit.js"></script></body></html>
