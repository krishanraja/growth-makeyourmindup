<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Repair log</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body class="entry"><div class="frame"><main class="log"><div class="rings" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="log-head"><div class="slot" data-fit="label"><p data-max="27" data-min="18">{{label}}</p></div><div class="tab" data-fit="entry"><p data-max="26" data-min="16">{{entry}}</p></div></div>
<div class="entry-title" data-fit="headline"><h1 data-max="68" data-min="38">{{headline}}</h1></div><section class="record"><div class="record-label">Expected</div><div class="record-copy" data-fit="expected"><p data-max="43" data-min="27">{{expected}}</p></div></section>
<section class="record"><div class="record-label">What happened</div><div class="record-copy" data-fit="happened"><p data-max="43" data-min="27">{{happened}}</p></div></section>
<section class="record"><div class="record-label">Change for next time</div><div class="record-copy" data-fit="change"><p data-max="43" data-min="27">{{change}}</p></div></section>
</main><div class="footer"><span>makeyourmindup.ai</span><div class="page" data-fit="page"><p data-max="25" data-min="18">{{page}}</p></div></div></div><script src="../../../fit.js"></script></body></html>
