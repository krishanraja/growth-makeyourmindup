<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Repair log</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body class="cover"><div class="frame"><main class="log"><div class="rings" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="log-head"><div class="slot" data-fit="label"><p data-max="27" data-min="18">{{label}}</p></div><div class="tab" data-fit="entry"><p data-max="26" data-min="16">{{entry}}</p></div></div>
<div class="title-box" data-fit="headline"><h1 data-max="112" data-min="58">{{headline}}</h1></div><div class="subtitle" data-fit="subhead"><p data-max="45" data-min="28">{{subhead}}</p></div><div class="log-foot" data-fit="note"><p data-max="23" data-min="17">{{note}}</p></div></main><div class="footer"><span>makeyourmindup.ai</span><div class="page" data-fit="page"><p data-max="25" data-min="18">{{page}}</p></div></div></div><script src="../../../fit.js"></script></body></html>
