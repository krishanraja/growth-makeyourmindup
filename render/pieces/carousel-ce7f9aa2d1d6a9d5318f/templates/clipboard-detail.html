<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Clipboard detail</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body><div class="frame detail"><main class="sheet"><div class="clip" aria-hidden="true"></div><div class="meta" data-fit="label"><div data-max="28" data-min="20">{{label}}</div></div><div class="title-box" data-fit="headline"><h1 data-max="80" data-min="48">{{headline}}</h1></div><section class="entry"><div class="box done"></div><div class="entry-content"><div class="entry-label" data-fit="task_label"><div data-max="26" data-min="20">{{task_label}}</div></div><div class="entry-copy" data-fit="task"><p data-max="46" data-min="30">{{task}}</p></div></div></section><section class="entry result"><div class="box"></div><div class="entry-content"><div class="entry-label" data-fit="result_label"><div data-max="26" data-min="20">{{result_label}}</div></div><div class="entry-copy" data-fit="result"><p data-max="46" data-min="30">{{result}}</p></div><div class="result-lines"></div><div class="result-lines"></div></div></section></main><div class="page-box" data-fit="page"><div data-max="25" data-min="20">{{page}}</div></div><div class="brandmark corner"></div></div><script src="../../../fit.js"></script></body></html>
