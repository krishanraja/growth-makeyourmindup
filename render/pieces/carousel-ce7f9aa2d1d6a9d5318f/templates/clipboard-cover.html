<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Clipboard cover</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body><div class="frame cover"><main class="sheet"><div class="clip" aria-hidden="true"></div><div class="meta" data-fit="label"><div data-max="28" data-min="20">{{label}}</div></div><div class="title-box" data-fit="headline"><h1 data-max="100" data-min="48">{{headline}}</h1></div><div class="copy-box" data-fit="subhead"><p data-max="40" data-min="28">{{subhead}}</p></div><div class="check-grid"><div class="check-column"><div class="column-label" data-fit="task_label"><div data-max="28" data-min="20">{{task_label}}</div></div><div class="check-line"><div class="box done"></div><div class="blank-line"></div></div><div class="check-line"><div class="box done"></div><div class="blank-line"></div></div><div class="check-line"><div class="box done"></div><div class="blank-line"></div></div></div><div class="check-column"><div class="column-label" data-fit="result_label"><div data-max="28" data-min="20">{{result_label}}</div></div><div class="check-line"><div class="box"></div><div class="blank-line"></div></div><div class="check-line"><div class="box"></div><div class="blank-line"></div></div><div class="check-line"><div class="box"></div><div class="blank-line"></div></div></div></div></main><div class="page-box" data-fit="page"><div data-max="25" data-min="20">{{page}}</div></div><div class="brandmark corner"></div></div><script src="../../../fit.js"></script></body></html>
