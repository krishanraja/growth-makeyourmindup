<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>storyboard</title><link rel="stylesheet" href="../../../kit.css"><link rel="stylesheet" href="../piece.css"><style>:root { --w: 1080px; --h: 1920px; --top: 250px; --bottom: 340px; }</style></head><body><div class="frame storyboard"><div class="fit tag" data-fit="beat"><div data-max="30" data-min="22">{{beat}}</div></div><div class="fit caption" data-fit="caption"><div data-max="42" data-min="18">{{caption}}</div></div><div class="scene"><div class="pair"><div class="agent"><div class="lights"><i></i><i></i><i></i></div><div class="fit agent-text" data-fit="left"><div data-max="46" data-min="26">{{left}}</div></div></div><div class="agent"><div class="lights"><i></i><i></i><i></i></div><div class="fit agent-text" data-fit="right"><div data-max="46" data-min="26">{{right}}</div></div></div></div><div class="table"><div class="loop"></div><div class="fit table-text" data-fit="table_label"><div data-max="36" data-min="24">{{table_label}}</div></div></div><div class="waiting"><div class="chair"></div><div class="fit wait-text" data-fit="waiting"><div data-max="28" data-min="20">{{waiting}}</div></div></div></div><div class="fit copy" data-fit="subtitle"><div data-max="48" data-min="28">{{subtitle}}</div></div></div><script src="../../../fit.js"></script></body></html>
