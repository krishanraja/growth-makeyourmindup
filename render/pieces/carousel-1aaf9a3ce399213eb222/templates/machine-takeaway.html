<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Machine card</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body><div class="frame close">
<div class="series" data-fit="series"><p class="label" data-max="26" data-min="18">{{label}}</p></div>
<div class="machine"><div class="main-panel">
<div class="glass" data-fit="display"><h1 class="headline" data-max="90" data-min="46">{{headline}}</h1></div>
<div class="tray" data-fit="collection tray"><p data-max="58" data-min="26">{{body}}</p></div>
</div><div class="rail"><div class="price" data-fit="price window"><p data-max="25" data-min="16">{{price}}</p></div><div class="coin"></div><div class="button"></div><div class="rail-lines"></div></div></div>
<div class="page-box" data-fit="page"><p data-max="24" data-min="18">{{page}}</p></div>
<div class="brandmark corner"></div>
</div><script src="../../../fit.js"></script></body></html>
