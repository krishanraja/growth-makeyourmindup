<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>cover</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body><div class="frame cover">
  {{photo:photo}}
  <div class="cover-words">
    <div class="fit big" data-fit="headline"><div><div data-max="140" data-min="72">{{headline}}</div><div class="accent" data-max="140" data-min="72">{{accent}}</div></div></div>
    <div class="glowline"></div>
    <div class="fit dek" data-fit="dek"><div data-max="40" data-min="28">{{dek}}</div></div>
  </div>
  <div class="brandmark corner"></div>
</div><script src="../../../fit.js"></script></body></html>
