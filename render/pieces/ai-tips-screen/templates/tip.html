<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>tip</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body><div class="frame tip">
  <div class="works"><div class="key">Works in</div><div class="tile">{{photo:logo1}}</div><div class="tile">{{photo:logo2}}</div><div class="tile">{{photo:logo3}}</div><div class="tile">{{photo:logo4}}</div></div>
  <div class="fit big" data-fit="headline"><div><div data-max="104" data-min="58">{{headline}}</div><div class="accent" data-max="104" data-min="58">{{accent}}</div></div></div>
  <div class="shot">{{photo:shot}}</div>
  <div class="try"><div class="fit" data-fit="try"><div data-max="34" data-min="24">{{try}}</div></div></div>
  <div class="fit steps" data-fit="steps"><div data-max="28" data-min="20">{{rows:steps}}</div></div>
  <div class="brandmark corner"></div>
</div><script src="../../../fit.js"></script></body></html>
