<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>tip</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body><div class="frame tip">
  <div class="head"><div class="tile">{{photo:logo}}</div><div class="fit tool" data-fit="tool"><div data-max="32" data-min="22">{{tool}}</div></div><div class="count">{{count}}</div></div>
  <div class="shot">{{photo:shot}}</div>
  <div class="fit big" data-fit="headline"><div><div data-max="112" data-min="60">{{headline}}</div><div class="accent" data-max="112" data-min="60">{{accent}}</div></div></div>
  <div class="panels">
    <div class="panel"><div class="key">What it does</div><div class="fit" data-fit="does"><div data-max="30" data-min="22">{{does}}</div></div></div>
    <div class="panel"><div class="key">Where</div><div class="fit" data-fit="where"><div data-max="30" data-min="22">{{where}}</div></div></div>
    <div class="panel"><div class="key">Who for</div><div class="fit" data-fit="who"><div data-max="30" data-min="22">{{who}}</div></div></div>
  </div>
  <div class="brandmark corner"></div>
</div><script src="../../../fit.js"></script></body></html>
