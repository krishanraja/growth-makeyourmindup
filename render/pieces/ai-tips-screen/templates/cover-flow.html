<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>cover-flow</title>
<link rel="stylesheet" href="../../../kit.css">
<link rel="stylesheet" href="../piece.css">
<style>:root { --w: 1080px; --h: 1350px; }</style></head>
<body><div class="frame cover flow">
  {{photo:photo}}
  <div class="chip c1">{{photo:step1}}</div>
  <div class="fit lab l1" data-fit="label1"><div data-max="28" data-min="20">{{label1}}</div></div>
  <div class="chip c2">{{photo:step2}}</div>
  <div class="fit lab l2" data-fit="label2"><div data-max="28" data-min="20">{{label2}}</div></div>
  <div class="chip c3">{{photo:step3}}</div>
  <div class="fit lab l3" data-fit="label3"><div data-max="28" data-min="20">{{label3}}</div></div>
  <div class="cover-words">
    <div class="fit big" data-fit="headline"><div><div data-max="120" data-min="64">{{headline}}</div><div class="accent" data-max="120" data-min="64">{{accent}}</div></div></div>
    <div class="fit dek" data-fit="dek"><div data-max="34" data-min="24">{{dek}}</div></div>
  </div>
  <div class="brandmark corner"></div>
</div><script src="../../../fit.js"></script></body></html>
