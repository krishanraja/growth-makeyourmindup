name: check
on: [push, pull_request]
jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
        # ubuntu-latest is Ubuntu 26.04, which setup-python has no 3.9 build for; 3.9 runs on 24.04.
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-24.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python growth.py --self-test
      - run: python growth.py doctor --offline
      - run: python growth.py dry-run
