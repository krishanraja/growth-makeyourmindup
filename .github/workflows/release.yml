name: release
# Lane L0. Every 30 minutes the engine reads Krish's signed go-lives, and the
# ideas and mocks he approved in the week's mix plan, from Control Center and
# schedules in Buffer exactly what he signed, once, at the signed time, each draft about an hour before it is due (until then a No
# stops it; one still scheduled after a No fails this run, so GitHub emails
# him). No model, no session, no PC. It never publishes immediately and
# never removes a post; LinkedIn stays his own click. This repository is
# public, so the log carries only counts and reason codes: no words, URLs,
# ids or keys, and nothing is uploaded.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Release signed go-lives to Buffer
        env:
          CONTROL_CENTER_ENGINE_TOKEN: ${{ secrets.CONTROL_CENTER_ENGINE_TOKEN }}
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GROWTH_WRITEBACK_TOKEN: ${{ secrets.GROWTH_WRITEBACK_TOKEN }}
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "::notice::The BUFFER_API_KEY secret is not set yet, so release is not configured. Nothing was read or scheduled."
            exit 0
          fi
          if [ -z "$CONTROL_CENTER_ENGINE_TOKEN" ]; then
            echo "::error::The CONTROL_CENTER_ENGINE_TOKEN secret is not set for this repository. Nothing was released."
            exit 1
          fi
          python growth.py run autorelease --deliver
      # A loud release run (a post still scheduled after a No) still ticks what did go out.
      - name: Tick the publish board for posts Buffer shows sent
        if: success() || failure()
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GROWTH_WRITEBACK_TOKEN: ${{ secrets.GROWTH_WRITEBACK_TOKEN }}
        run: python growth.py run board tick --deliver
      # Ruling (Krish, 2026-11-12): any off-day post moves to any day at his press. Every off-day post this engine
      # made, scheduled or posted goes back to the board's one place, from its own record: the board shows it out, and
      # says plainly when one is still scheduled for a day it left.
      - name: Write back this engine's off-day posts to the publish board
        if: success() || failure()
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GROWTH_WRITEBACK_TOKEN: ${{ secrets.GROWTH_WRITEBACK_TOKEN }}
          CONTROL_CENTER_ENGINE_TOKEN: ${{ secrets.CONTROL_CENTER_ENGINE_TOKEN }}
        run: python growth.py run board posts --deliver
