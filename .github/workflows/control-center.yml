name: control-center
# Control Center wakes this engine every morning (05:10 UTC) with a
# repository_dispatch of type cc-growth-directive. The runner journals the
# attempt, pulls the directive, keeps its web_analytics block for the measure
# job, checks the engine offline, reports with a readback, reads Krish's
# decisions and journals the end. It never posts, sends, publishes or spends,
# and it uploads nothing: this repository is public, so its log carries only
# counts, codes and digests.
#
# Krish's instruction (protocol 1.20.0) can wake it again the same day, with
# client_payload.instruction_id: that run reports under its own run_id
# (--wake, the GitHub run id and attempt), acks the instruction as received
# and leaves acting on it to the next publication workspace job. The id is
# the only thing it prints; his words never reach this public log.
#
# The 05:40 UTC schedule is the backup: it first asks the GitHub API whether a
# repository_dispatch run of this workflow already succeeded today (UTC). If
# one did it stops with "dispatch already ran today"; otherwise it runs the
# same loop under its own run_id. A run woken by Krish's instruction is named
# "control-center instruction wake" (run-name below) and never counts as the
# morning push (engine/run/backup.py WAKE_TITLE).
#
# One write to this repository (Ruling, Krish, 2026-11-13: Make Your Mind Up's
# growth engine proposes its AI-answer questions for his approval). When the
# runner wrote the questions Krish approved into config/ai-answer-questions.json,
# or recorded the AEO ask for them, it hands that one file to the commit job as
# a job output. The commit job holds no secret and runs no engine code: it
# checks the file is JSON and commits it, alone, to main. The loop keeps
# read-only contents and no git credential.
run-name: ${{ github.event.client_payload.instruction_id && 'control-center instruction wake' || 'control-center' }}
on:
  repository_dispatch:
    types: [cc-growth-directive]
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: control-center-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      questions: ${{ steps.questions.outputs.file }}
    steps:
      - name: Start the run clock
        run: echo "GROWTH_RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Skip the backup when the dispatch already ran today
        id: backup
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python growth.py run dispatch-check
      - name: Report to Control Center
        if: steps.backup.outputs.skip != 'true'
        env:
          CONTROL_CENTER_ENGINE_TOKEN: ${{ secrets.CONTROL_CENTER_ENGINE_TOKEN }}
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
          CC_DISPATCH_ENGINE_ID: ${{ github.event.client_payload.engine_id }}
          CC_DISPATCH_INSTRUCTION_ID: ${{ github.event.client_payload.instruction_id }}
        run: |
          if [ -z "$CONTROL_CENTER_ENGINE_TOKEN" ]; then
            echo "::error::The CONTROL_CENTER_ENGINE_TOKEN secret is not set for this repository. Nothing was reported."
            exit 1
          fi
          if [ -z "$CONTROL_CENTER_URL" ]; then
            echo "::error::The CONTROL_CENTER_URL repository variable is not set. Nothing was reported."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python growth.py cc runner --deliver --backup
          elif [ -n "$CC_DISPATCH_INSTRUCTION_ID" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A second wake the same day (Krish's instruction, protocol 1.20.0, or a run by hand) reports
            # under its own run_id, never the morning's. Only the id is used; his words never reach this log.
            python growth.py cc runner --deliver --wake "gh${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          else
            python growth.py cc runner --deliver
          fi
      - name: Hand on the AI-answer questions Krish approved
        id: questions
        if: always() && steps.backup.outputs.skip != 'true'
        run: |
          file=config/ai-answer-questions.json
          if git diff --quiet -- "$file"; then
            echo "ai-answer questions: unchanged"
          else
            echo "file=$(base64 -w0 "$file")" >> "$GITHUB_OUTPUT"
            echo "ai-answer questions: changed, handed to the commit job"
          fi

  commit:
    # Commits only config/ai-answer-questions.json, as the loop wrote it from Krish's decision.
    needs: loop
    if: always() && needs.loop.outputs.questions != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: ai-answer-questions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Commit the AI-answer questions Krish approved
        env:
          QUESTIONS_B64: ${{ needs.loop.outputs.questions }}
        run: |
          file=config/ai-answer-questions.json
          printf '%s' "$QUESTIONS_B64" | base64 -d > "$file.new"
          python3 -I -c 'import json, sys; d = json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(d, dict) and isinstance(d.get("questions"), list)' "$file.new"
          mv "$file.new" "$file"
          if git diff --quiet -- "$file"; then
            echo "ai-answer questions: already on main"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$file"
          git commit -q -m "config: the AI-answer questions Krish approved, for AEO-Engine" -m "Written by growth.py cc runner (engine/ai_answers.py) from his decision in Control Centre."
          for attempt in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "ai-answer questions: committed"
              exit 0
            fi
            sleep 10
          done
          echo "ai-answer questions: push_failed; the next run writes them again"
          exit 1
