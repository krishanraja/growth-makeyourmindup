name: handoff
# Lane L0. A session or PC automation that saved the drafts wakes this
# workflow with a repository_dispatch (or Krish runs it by hand as a
# workflow_dispatch). A session never holds the Control Center token, so
# this runner turns the handoff into a Control Center proposal
# Krish approves with one press: it reads each Buffer draft, rebuilds its
# digest and proposes the go-live (or the week's ask, or the week's mix plan
# of ideas and mocks), with a readback, and records the review of each post
# made from an approved concept. It never schedules, publishes, sends or
# spends; release.yml acts only after he approves. This repository is public, so the log carries only counts and
# reason codes: no words, URLs, ids or keys, and nothing is uploaded. The
# client_payload is read in Python from the event file ($GITHUB_EVENT_PATH)
# and written to $RUNNER_TEMP. It is never placed in a step's env (GitHub
# prints env values in the log header) and never in a shell line.
on:
  repository_dispatch:
    types: [growth-go-live-manifest, growth-week-packet, growth-make-piece, growth-mix-plan]
  workflow_dispatch:
    inputs:
      event:
        description: 'The handoff type to test'
        required: true
        type: choice
        options: [growth-go-live-manifest, growth-week-packet, growth-make-piece, growth-mix-plan]
      payload:
        description: 'The client_payload as JSON (synthetic for a test)'
        required: true
        type: string
      deliver:
        description: 'Report to Control Center (off: a dry run that reports nothing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HANDOFF_EVENT: ${{ github.event_name == 'repository_dispatch' && github.event.action || inputs.event }}
      HANDOFF_DELIVER: ${{ github.event_name == 'repository_dispatch' || inputs.deliver }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Write the payload to a file
        run: |
          python - <<'PY'
          import json
          import os
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as handle:
              event = json.load(handle)
          if os.environ.get('GITHUB_EVENT_NAME') == 'repository_dispatch':
              text = json.dumps(event.get('client_payload'))
          else:
              text = (event.get('inputs') or {}).get('payload') or ''
          path = os.path.join(os.environ['RUNNER_TEMP'], 'handoff-payload.json')
          with open(path, 'w', encoding='utf-8') as handle:
              handle.write(text)
          PY
      - name: Propose to Control Center
        env:
          CONTROL_CENTER_ENGINE_TOKEN: ${{ secrets.CONTROL_CENTER_ENGINE_TOKEN }}
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          HANDOFF_FILE="$RUNNER_TEMP/handoff-payload.json"
          if [ "$HANDOFF_EVENT" != "growth-make-piece" ] && [ -z "$CONTROL_CENTER_ENGINE_TOKEN" ]; then
            echo "::error::The CONTROL_CENTER_ENGINE_TOKEN secret is not set for this repository. Nothing was proposed."
            exit 1
          fi
          if [ "$HANDOFF_DELIVER" = "true" ]; then
            python growth.py run handoff --event "$HANDOFF_EVENT" --payload "$HANDOFF_FILE" --deliver
          else
            python growth.py run handoff --event "$HANDOFF_EVENT" --payload "$HANDOFF_FILE"
          fi
