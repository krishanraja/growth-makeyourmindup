name: maker
# Lane L0. Every day at 04:30 UTC (Control Center's clock; GitHub's schedule at 04:33 is the backup) (just before or just after midnight in New
# York) the maker reads the ideas and mocks Krish approved in the week's mix
# plan from Control Center, makes the rest of today's and all of tomorrow's (New York) posts from them as
# Buffer drafts (saved as drafts with no due time, never published), and hands
# each one off with its review, so release.yml can schedule it later under
# every gate. The words and their blind review come from the Anthropic API.
# With no approved mix for a week (Ruling, Krish, 2026-11-12) it drafts from
# the standing plan instead, into Control Center only (never Buffer, never
# handed to release), and puts one ask a week on his list (docs/MAKER.md,
# "With no approved mix").
# Run by hand it is a dry run unless deliver is ticked: it writes and reviews
# the words but saves nothing and reports nothing. It never schedules,
# publishes or deletes, and never touches LinkedIn. This repository is
# public, so the log carries only counts and reason codes: no words, URLs,
# ids or keys, and nothing is uploaded.
on:
  schedule:
    - cron: '33 4 * * *'
  # Control Center's clock knocks this workflow (gmymu-3, gha-1 of the 14 Nov 2026 audit: GitHub starts its schedules
  # about four times a day). Either route works, with no payload read: a repository_dispatch of type growth-mymu-maker, or
  # api/_watchdogClock.ts knockWorkflow (a workflow_dispatch with trigger control-center-clock). The schedule stays as
  # the backup, off :00 and :30, where GitHub's queue is longest.
  repository_dispatch:
    types: [growth-mymu-maker]
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Who started it: control-center-clock delivers, as the schedule does; empty is by hand'
        required: false
        type: string
        default: ''
      deliver:
        description: 'Save the drafts in Buffer and hand them off (off: a dry run)'
        required: false
        type: boolean
        default: false
      day:
        description: 'The New York day to make, YYYY-MM-DD: today or tomorrow there only (empty: the rest of today and all of tomorrow)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: maker
  cancel-in-progress: false

jobs:
  maker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAKER_DELIVER: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.trigger == 'control-center-clock' || inputs.deliver }}
      MAKER_DAY: ${{ inputs.day }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Make tomorrow's drafts from approved ideas and mocks
        env:
          CONTROL_CENTER_ENGINE_TOKEN: ${{ secrets.CONTROL_CENTER_ENGINE_TOKEN }}
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROWTH_WRITEBACK_TOKEN: ${{ secrets.GROWTH_WRITEBACK_TOKEN }}
        run: |
          if [ -z "$CONTROL_CENTER_ENGINE_TOKEN" ]; then
            echo "::error::The CONTROL_CENTER_ENGINE_TOKEN secret is not set for this repository. Nothing was made."
            exit 1
          fi
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "::error::The BUFFER_API_KEY secret is not set for this repository. Nothing was made."
            exit 1
          fi
          set -- run maker
          if [ "$MAKER_DELIVER" = "true" ]; then
            set -- "$@" --deliver
          fi
          if [ -n "$MAKER_DAY" ]; then
            set -- "$@" --day "$MAKER_DAY"
          fi
          python growth.py "$@"
